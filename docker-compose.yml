services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: med_ai
      MYSQL_USER: medai
      MYSQL_PASSWORD: medai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_CHAT_MODEL:-llama3.1:8b} &&
       OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"

  # ── Auth Service (starts first — all other app services depend on it) ────────

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-32-char-jwt-secret-key}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-medai-internal-secret}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # ── Application Services ─────────────────────────────────────────────────────

  vector-data-service:
    build:
      context: .
      dockerfile: vector-data-service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      AUTH_SERVICE_URL: http://auth-service:8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-medai-internal-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  main-orchestrator:
    build:
      context: .
      dockerfile: main-orchestrator/Dockerfile
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/med_ai
      MYSQL_USERNAME: medai
      MYSQL_PASSWORD: medai
      VECTOR_SERVICE_URL: http://vector-data-service:8082
      OLLAMA_BASE_URL: http://ollama:11434
      AUTH_SERVICE_URL: http://auth-service:8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-medai-internal-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
    depends_on:
      mysql:
        condition: service_healthy
      vector-data-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://main-orchestrator:8081
      AUTH_SERVICE_URL: http://auth-service:8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-medai-internal-secret}
    depends_on:
      main-orchestrator:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Observability ────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  qdrant-data:
  ollama-data:
  prometheus-data:
  grafana-data:
