services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: med_ai
      MYSQL_USER: medai
      MYSQL_PASSWORD: medai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 8 &&
       OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_CHAT_MODEL:-llama3.1:8b} &&
       OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"

  vector-data-service:
    build:
      context: .
      dockerfile: vector-data-service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-change-this-32-char-jwt-secret-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - qdrant
      - ollama-init
    ports:
      - "8082:8082"

  main-orchestrator:
    build:
      context: .
      dockerfile: main-orchestrator/Dockerfile
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/med_ai
      MYSQL_USERNAME: medai
      MYSQL_PASSWORD: medai
      VECTOR_SERVICE_URL: http://vector-data-service:8082
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-change-this-32-char-jwt-secret-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      vector-data-service:
        condition: service_started
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://main-orchestrator:8081
      JWT_SECRET: ${JWT_SECRET:-change-this-32-char-jwt-secret-key}
    depends_on:
      - main-orchestrator
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  qdrant-data:
  ollama-data:
  prometheus-data:
  grafana-data:
