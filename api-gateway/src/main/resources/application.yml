server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: main-orchestrator
          uri: ${ORCHESTRATOR_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  security:
    jwt-secret: ${JWT_SECRET:change-this-32-char-jwt-secret-key}
