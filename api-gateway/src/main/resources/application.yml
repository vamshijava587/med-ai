server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: main-orchestrator
          uri: ${ORCHESTRATOR_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Auth-service integration
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8083}
    internal-api-key: ${INTERNAL_API_KEY:medai-internal-secret}
